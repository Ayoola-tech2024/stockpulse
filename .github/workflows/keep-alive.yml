name: Keep Supabase Active

on:
  schedule:
    # Runs every 3 days at 00:00 UTC (well within Supabase's 7-day auto-pause limit)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Ping Supabase Database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node -e "
            const { PrismaClient } = require('@prisma/client');
            const prisma = new PrismaClient();
            async function ping() {
              const count = await prisma.session.count();
              console.log('Supabase Ping Success! Session count:', count, 'Timestamp:', new Date().toISOString());
            }
            ping()
              .catch(err => { console.error('Ping failed:', err); process.exit(1); })
              .finally(() => prisma.\$disconnect());
          "
