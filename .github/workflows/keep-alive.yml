name: Keep Supabase Active

on:
  schedule:
    # Runs every 3 days at 00:00 UTC (well within Supabase's 7-day auto-pause limit)
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase PostgreSQL via psql
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          # Strip pgbouncer query parameter which psql does not recognize
          CLEAN_URL=$(echo "$DATABASE_URL" | sed 's/[?&]pgbouncer=true//g')
          psql "$CLEAN_URL" -c "SELECT count(*) FROM \"Session\";"
          echo "Supabase successfully pinged at $(date -u)"
